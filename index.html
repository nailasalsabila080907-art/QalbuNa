<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QalbuNa</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Background Glow -->
  <div class="background-glow glow1"></div>
  <div class="background-glow glow2"></div>

  <!-- Container -->
  <div class="container">

    <!-- Header -->
    <div class="header">

      <h1>QalbuNa</h1>

      <p class="subtitle">
        Tenangkan hati dengan mengingat Allah ✨
      </p>

    </div>

    <!-- Main Layout -->
    <div class="main-layout">

      <!-- LEFT -->
      <div class="left-side">

        <!-- Select Dzikir -->
        <div class="card">

          <label>Pilih Dzikir</label>

          <select id="dzikirSelect">

            <option value="subhanallah">
              Subhanallah
            </option>

            <option value="alhamdulillah">
              Alhamdulillah
            </option>

            <option value="allahuakbar">
              Allahu Akbar
            </option>

            <option value="astaghfirullah">
              Astaghfirullah
            </option>

            <option value="lailahaillallah">
              Laa Ilaaha Illallah
            </option>

            <option value="dzikirPagi">
              Dzikir Pagi
            </option>

            <option value="dzikirPetang">
              Dzikir Petang
            </option>

            <option value="ayatKursi">
              Ayat Kursi
            </option>

            <option value="sholawat">
              Sholawat Nabi
            </option>

             <option value="zikirArrafah ">
              Zikir Arrafah
            </option>

          </select>

        </div>

        <!-- Dzikir Box -->
        <div class="dzikir-box">

          <div class="category" id="category">
            Dzikir Harian
          </div>

          <div class="arabic" id="arabicText">
            سبحان الله
          </div>

          <div class="latin" id="latinText">
            Subhanallah
          </div>

          <div class="meaning" id="meaningText">
            Maha Suci Allah
          </div>

        </div>

      </div>

      <!-- RIGHT -->
      <div class="right-side">

        <!-- Counter -->
        <div class="counter" id="count">
          0
        </div>

        <!-- Progress -->
        <div class="progress-container">

          <div class="progress-bar" id="progressBar"></div>

        </div>

        <!-- Target -->
        <div class="target-setting">

          <label>
            🎯 Target Dzikir
          </label>

          <div class="target-box">

            <button onclick="kurangTarget()">
              −
            </button>

            <input
              type="text"
              id="targetInput"
              value="33"
              readonly
            >

            <button onclick="tambahTargetValue()">
              +
            </button>

          </div>

        </div>

        <!-- Progress Text -->
        <div class="target-text">
          Progress
          <span id="progressText">0</span> /
          <span id="targetNumber">33</span>
        </div>

        <!-- Buttons -->
        <div class="buttons">

          <button class="btn-count" onclick="tambah()">
            +
          </button>

          <button class="btn-reset" onclick="resetCount()">
            Reset
          </button>

        </div>

      </div>

    </div>

    <!-- Quote -->
    <div class="quote" id="quote">
      “Hati menjadi tenang dengan mengingat Allah.”
    </div>

  </div>

  <!-- Audio -->
  <audio id="clickSound">
    <source
      src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
      type="audio/mpeg"
    >
  </audio>

  <script src="script.js"></script>

</body>

</html>
